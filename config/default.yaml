# Database Configuration
database:
  host: localhost
  port: 5432
  database: imdbload
  user: postgres
  password: "pass"
  timeout: 1800  # 30 minutes in seconds

# Optimization Parameters
optimization:
  storage_limit_mb: 50
  storage_limit_bytes: 52428800  # 50 * 1024 * 1024
  insert_queries: 1000
  
  # Which algorithms to run
  algorithms:
    normal: true
    bigsubs: true
    utility_capacity: true
    utility: true
    frequency: true

# Benchmark Configuration
benchmark:
  type: job  # 'job' or 'ceb'
  workloads_dir: Output/RED_WORKLOADS
  queries_dir: dataset/RED_JSON
  sql_dir: dataset/RED_SQL
  
  # Query selection mode (not used by the experiments of the paper)
  # 'redbench': select the queries listed in a Redbench workload CSV (83 queries)
  # 'all_job': use all JOB queries in dataset/RED_JSON/job/ (113 queries)
  query_selection_mode: all_job  # 'redbench' or 'all_job'

# Query Configuration
query:
  num_queries: 113  # JOB benchmark
  use_ceb: false    # Use CEB queries in addition to JOB

# Paths
paths:
  output_dir: Output
  experiments_dir: Output/experiments
  logs_dir: Output/logs
  artifacts_dir: Output/artifacts
  query_rewrite_dir: Output/query_rewrite
  mv_list_dir: Output

# Execution Phases Configuration
# Whether to run each phase (not used by scripts/run_experiment_normal.py, which selects the
# phases with --phase)
execution:
  phases:
    query_parsing: true       # [1/6] query parsing
    optimization: true         # [2/6] MV selection (ILP optimization)
    sql_generation: true      # [3/6] MV creation SQL
    mv_creation: true         # [4/6] MV creation (database)
    query_rewriting: true      # [5/6] query rewriting
    benchmark: true            # [6/6] benchmark
  
  # Alternatively, a range can be given with start_from / end_at
  # start_from: query_parsing     # first phase to run
  # end_at: query_rewriting       # last phase to run

# Logging Configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: output/logs/experiment.log
  console: true
