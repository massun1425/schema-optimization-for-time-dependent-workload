[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mv-query-optimization"
version = "0.1.0"
description = "Materialized View Selection using ILP Optimization"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "OnizukaLab"}
]

# Pinned to the versions used for the experiments of the paper (keep in sync with
# requirements.txt). The ILP results can depend on the Gurobi version.
dependencies = [
    "gurobipy==12.0.1",
    "numpy==2.4.2",
    "psycopg2-binary==2.9.11",
    "PyYAML==6.0.3",
    "sqlparse==0.5.3",
    "matplotlib==3.10.8",   # figures (paper_figures/)
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
  | dataset
  | Output
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "N803",  # argument name should be lowercase (mathematical notation)
    "N806",  # variable in function should be lowercase (mathematical notation)
]
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "venv",
    "dataset",
    "Output",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # to be enabled gradually
ignore_missing_imports = true
exclude = [
    "dataset/",
    "Output/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]
