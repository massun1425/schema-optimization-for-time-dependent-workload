[package]
name = "pyext-rustlib"
version = "0.1.0"
authors = ["Frank Luan <lsf@berkeley.edu>"]
edition = "2018"

[lib]
name = "rustlib"
crate-type = ["dylib"]

[dependencies]
bincode = "1.2"
ndarray = { version = "0.13", features = ["rayon"] }
numpy = "0.13"
pyo3 = { version = "0.13.2", features = ["extension-module"] }
rand = { version = "0.7", features = ["small_rng"] }
rayon-core = "1.7"
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
either = "1.6"
ghost = "0.1"
proc-macro2 = "1.0"
quote = "1.0"
syn = "1.0"
num-traits = "0.2"
regex = "1.5"
memchr = "2.5"