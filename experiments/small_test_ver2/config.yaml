# =====================================================
# 小規模実験用設定ファイル
# =====================================================

# データベース接続設定
database:
  host: localhost
  port: 5432
  # === データベース切り替え ===
  # 小規模実験用: mv_small_test
  # JOB/IMDBベンチマーク用: imdbload
  # database: mv_small_test
  database: imdbload  # JOBベンチマーク実行時はこちらをコメント解除
  user: postgres
  password: "1608"
  timeout: 300

# 最適化パラメータ（小規模実験用）
optimization:
  # === ストレージ制限切り替え ===
  # 小規模実験用: 10KB
  # storage_limit_mb: 0.01              
  #storage_limit_bytes: 10240  # 10KB
  # JOBベンチマーク用: 100MB（推奨） - 使用時は上記2行をコメントアウト
  storage_limit_mb: 100
  storage_limit_bytes: 104857600  # 100MB
  
  insert_queries: 50               # 挿入クエリ数: 50回
  
  # 使用するアルゴリズム（normalのみ使用）
  algorithms:
    normal: true                   # 基本ILP
    bigsubs: false                 # 未使用
    utility: false                 # 未使用
    utility_capacity: false        # 未使用
    frequency: false               # 未使用

# ベンチマーク設定
benchmark:
  type: custom
  # === クエリディレクトリ切り替え ===
  # 小規模実験用 (3クエリ)
  queries_dir: experiments/small_test_ver2/02_json
  sql_dir: experiments/small_test_ver2/01_queries
  # JOBベンチマーク用 (113クエリ) - 使用時は上記2行をコメントアウト
  # queries_dir: dataset/redbench/imdb/benchmarks/job/json
  # sql_dir: dataset/redbench/imdb/benchmarks/job/sql
  workloads_dir: ""
  query_selection_mode: all_job    # すべてのJOBクエリを使用

# パス設定(すべて experiments/small_test_ver2/ 配下に集約)
paths:
  output_dir: experiments/small_test_ver2
  experiments_dir: experiments/small_test_ver2/04_optimized
  logs_dir: experiments/small_test_ver2/logs
  artifacts_dir: experiments/small_test_ver2/artifacts
  query_rewrite_dir: experiments/small_test_ver2/06_rewritten
  mv_list_dir: experiments/small_test_ver2

# クエリ設定
query:
  # === クエリ数切り替え ===
  # 小規模実験用: 3
  # num_queries: 3
  # JOBベンチマーク用: 113（全クエリ）
  num_queries: 113

# 実行制御（段階的実行用）
execution:
  phases:
    query_parsing: true            # フェーズ1: クエリパース
    optimization: true             # フェーズ2: ILP最適化
    sql_generation: true           # フェーズ3: MV生成SQL作成
    mv_creation: false             # フェーズ4: MV作成（初回はfalse）
    query_rewriting: true          # フェーズ5: クエリリライト
    benchmark: false               # フェーズ6: ベンチマーク（初回はfalse）

# ログ設定
logging:
  level: INFO
  console: true
  file: experiments/small_test_ver2/logs/experiment.log
